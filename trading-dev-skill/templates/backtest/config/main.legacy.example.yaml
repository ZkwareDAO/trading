# =============================================================================
# 回测配置示例（旧格式 - 所有配置在一个文件中）
# =============================================================================
# 复制此文件到 backtest/config/main.yaml 并根据需要修改
#
# 使用方式:
#   python -m backtest.batch_runner --config backtest/config/main.yaml
#
# CLI 参数可覆盖此文件配置:
#   --start YYYYMMDD    覆盖 start
#   --end YYYYMMDD      覆盖 end
#
# 格式说明:
#   strategies 为列表格式（数组），每个元素包含:
#     - name: 策略名称（对应 strategies/{name}/ 目录）
#     - symbols: 交易对列表
#     - enabled: 是否启用（默认 true）
#     - config_path: 配置文件目录（可选，默认 backtest/config）
#     - overrides: 策略参数覆盖（可选）
# =============================================================================

# -----------------------------------------------------------------------------
# 时间范围配置
# -----------------------------------------------------------------------------

# 回测起始时间 (必需)
start: "20250101"

# 回测结束时间 (可选)
# 不配置则使用当前时间
end: "20260331"

# -----------------------------------------------------------------------------
# 数据与输出配置
# -----------------------------------------------------------------------------

# K 线数据目录
data_dir: "./data/strategies"

# 回测输出目录
output_dir: "./backtest_output"

# 输出目录日期模式
use_today_as_output_date: true

# -----------------------------------------------------------------------------
# 执行配置
# -----------------------------------------------------------------------------

# 并发工作进程数
max_workers: 4

# 日志级别
log_level: "INFO"

# -----------------------------------------------------------------------------
# 策略配置（列表格式）
# -----------------------------------------------------------------------------

strategies:
  # 基础示例
  - name: {strategy_name}
    symbols: ["BTCUSDT", "ETHUSDT"]
    enabled: true

  # 带 overrides 示例
  - name: {strategy_name}
    symbols: ["BTCUSDT", "SOLUSDT"]
    enabled: true
    overrides:
      signal:
        min_strength: 0.5

  # 禁用策略示例
  - name: {strategy_name}
    symbols: ["BTCUSDT"]
    enabled: false