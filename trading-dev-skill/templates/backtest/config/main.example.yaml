# =============================================================================
# 回测配置示例
# =============================================================================
# 复制此文件到 backtest/config/main.yaml 并根据需要修改
#
# 使用方式:
#   python -m backtest.batch_runner
#
# 策略配置在 backtest/config/strategies.yaml 中
# 此文件只包含回测参数（时间范围、输出目录等）
#
# CLI 参数可覆盖此文件配置:
#   --start YYYYMMDD    覆盖 start
#   --end YYYYMMDD      覆盖 end
#
# 环境变量可覆盖配置文件路径:
#   BACKTEST_CONFIG_PATH=backtest/config/custom.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# 时间范围配置
# -----------------------------------------------------------------------------

# 回测起始时间 (必需)
# 格式: YYYYMMDD 或 YYYY-MM-DD 或 Unix 时间戳
start: "20250101"

# 回测结束时间 (可选)
# 不配置则使用当前时间
# end: "20250331"

# -----------------------------------------------------------------------------
# 数据与输出配置
# -----------------------------------------------------------------------------

# K 线数据目录
# 存放各策略的历史 K 线 CSV 文件
data_dir: "./data/strategies"

# 回测输出目录
# 存放回测结果、信号 CSV、统计报告等
output_dir: "./backtest_output"

# 输出目录日期模式
# true: 使用当天日期（UTC），便于区分不同运行
# false: 使用回测结束日期（end）
use_today_as_output_date: true

# -----------------------------------------------------------------------------
# 执行配置
# -----------------------------------------------------------------------------

# 并发工作进程数
# 建议: CPU 核心数 - 1
max_workers: 4

# 日志级别
# 可选值: DEBUG, INFO, WARNING, ERROR
log_level: "INFO"
