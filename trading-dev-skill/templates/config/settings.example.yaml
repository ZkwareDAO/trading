# =============================================================================
# 系统配置示例 - 实盘/回测共用
# =============================================================================
# 复制此文件到 config/settings.yaml 并根据实际环境填写
#
# 本文件说明系统级配置（数据管理、信号日志、止损检测模式等）。
# 策略运行配置在 strategies/<name>/overrides/<symbol>.yaml 中（per-symbol）。
#
# 使用方式：
#   多策略: python run_strategies_manager.py
#   单策略: python run_strategy.py --name <name> --symbol <SYMBOL>
#   回测:   python -m backtest.run_backtest
#
# 模块说明：
#   - data_manager:    数据管理器（K线 CSV + Binance 实时行情）
#   - signal_logging:  信号日志（CSV 持久化）
#   - direct_trading:  交易所直连下单（存储信号后直接下单）
#
# 交易所凭证不走 ${VAR} 占位：BINANCE_API_KEY / BINANCE_API_SECRET 只放 .env，
# 由代码直接读环境变量，本文件不出现（避免有人误填明文后提交）。
# =============================================================================

# -----------------------------------------------------------------------------
# 止损止盈检测模式
# -----------------------------------------------------------------------------
# true:  使用 bar_high/bar_low（闭合 K 线最高/最低价，更准确检测 K 线内价格波动）
# false: 使用 current_price（K 线收盘价，简单但可能遗漏 K 线内的止损触发）
use_bar_high_low_for_exit: false

# -----------------------------------------------------------------------------
# 数据管理器配置
# -----------------------------------------------------------------------------
# K线数据源：CSV 本地文件 + Binance 公共源实时推送（WebSocket 直连 fstream，
# 历史下载直连 fapi），无中间服务。
#
# 关键字段：
#   - csv_dir:                K线 CSV 文件目录
#   - csv_filename_pattern:   CSV 文件命名格式（变量: {symbol}, {timeframe}）
#   - cache_max_size:         内存缓存最大条数
#   - sync_history_days:      启动时补齐历史数据天数上限（run_strategy.py 读取）
# -----------------------------------------------------------------------------
data_manager:
  # K线 CSV 文件目录（历史数据）
  csv_dir: "./data/klines"

  # CSV 文件命名格式（支持变量: {symbol}, {timeframe}）
  csv_filename_pattern: "{symbol}_{timeframe}.csv"

  # 内存缓存配置（避免重复读取 CSV）
  cache_max_size: 10000

  # 启动时是否自动加载数据（建议开启）
  auto_load: true

  # 启动时补齐历史数据的天数上限（run_strategy.py 读取，默认 365）
  sync_history_days: 365

# -----------------------------------------------------------------------------
# 信号日志配置
# -----------------------------------------------------------------------------
# 信号存储：CSV 持久化；下单走 direct_trading 交易所直连（见下方配置）。
# paper_trading 模式下不下单，仅写 CSV。
#
# 关键字段：
#   - storage.type: 存储类型（目前仅支持 csv）
#   - storage.path: 信号 CSV 存储目录（按 strategy_id 分子目录）
#   - retention_days: 信号保留天数（自动清理）
# -----------------------------------------------------------------------------
signal_logging:
  # 存储配置
  storage:
    type: "csv"                # 存储类型（目前仅支持 csv）
    path: "./data/signals"     # 信号 CSV 存储目录（路径: {path}/{strategy_id}/{YYYYMMDD}.csv）

  # 信号保留天数（超过此天数的信号会被自动清理）
  retention_days: 90

# -----------------------------------------------------------------------------
# 交易所直连下单配置
# -----------------------------------------------------------------------------
# 启用后策略产生的信号在落盘后直接调用交易所 REST 下单。
#
# 前置条件（缺一不可，否则拒单）：
#   1. .env 中配置 BINANCE_API_KEY / BINANCE_API_SECRET（只勾合约权限，禁提现，绑 IP）
#   2. 币安账户为单向持仓模式（One-way Mode），双向持仓（Hedge Mode）会被拒单
#   3. overrides/<symbol>.yaml 中 signal.exchange 必须为 binance，其他值一律拒单
#
# trading_mode 与下单的关系（容易误判，务必看清）：
#   live    → 会下真单
#   smoking → 会下真单（冒烟模式就是用真单验证全链路）
#   paper_trading → 不下单（唯一有防线的模式）
# 不想下真单时必须用 paper_trading，smoking 兜不住。
#
# 关键字段：
#   - enabled:     是否启用直连下单
#   - exchange:    交易所标识，目前仅支持 binance U 本位合约
#   - testnet:     是否走测试网（首次接入务必先 true 验证）
#   - recv_window: 签名请求有效窗口（毫秒），过小易因时钟偏移被拒
#   - timeout:     单次 REST 请求超时（秒）
#   - max_retries: 重试次数，仅对网络异常与 5xx 生效；4xx 是交易所明确拒绝，一律不重试
# -----------------------------------------------------------------------------
direct_trading:
  enabled: false        # 是否启用直连下单
  exchange: "binance"   # 目前仅支持 binance U 本位合约
  testnet: false        # true → testnet.binancefuture.com
  recv_window: 5000     # 签名请求有效窗口（毫秒）
  timeout: 10.0         # 单次请求超时（秒）
  max_retries: 2        # 仅对网络异常与 5xx 重试；4xx 一律不重试

# =============================================================================
# 配置加载与优先级说明
# =============================================================================
# 系统级配置：config/settings.yaml（本文件）
#
# 策略级配置（per-symbol）：strategies/<name>/overrides/<symbol>.yaml
#   运行参数优先级（高 → 低）：
#     1. CLI 参数（--interval / --version / --trading-mode）
#     2. overrides/<symbol>.yaml
#     3. 代码默认值
#
# 运行模式 trading_mode 进入 strategy_id 后缀（LIVE/PAPER/SMOKING），
# live 与 paper_trading 的仓位/信号/日志天然隔离，互不覆盖。
# =============================================================================
