# =============================================================================
# 策略运行配置 - 实盘/回测共用
# =============================================================================
# 使用方式:
#   实盘: python run_strategies_manager.py
#   回测: python -m backtest.batch_runner --config config/strategies.yaml
#
# 配置格式（简化版）:
#   每个策略直接定义完整配置，无需 defaults/templates 层级
#
# 策略字段说明:
#   - trading_mode: 运行模式（live / paper_trading / smoking）
#   - config_dir: 策略参数配置目录（默认 strategies，per-symbol 覆盖在 strategies/<name>/overrides/）
#   - symbols: 交易对列表
#   - overrides: 回测参数覆盖（可选）
#
# interval 和 version 从 strategies/<name>/overrides/<symbol>.yaml 自动读取
#
# symbols 支持两种格式：
# 1. 字符串数组（所有 symbol 使用相同 trading_mode）:
#    symbols: [BTCUSDT, ETHUSDT, SOLUSDT]
#
# 2. 对象数组（每个 symbol 可独立配置 trading_mode）:
#    symbols:
#      - name: BTCUSDT
#        trading_mode: "live"
#      - name: SOLUSDT
#        trading_mode: "paper_trading"
# =============================================================================

