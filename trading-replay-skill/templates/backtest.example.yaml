# =============================================================================
# 回测 run-profile
# =============================================================================
# 仅承载回测的运行方式：时间范围 / 初始资金 / 手续费 / 输出 / 并发。
# 绝不含策略参数（策略参数唯一来源是 strategies/<name>/overrides/<SYM>.yaml）。
#
# 使用方式：
#   python -m backtest.run_backtest --strategies example_ma_cross:BTCUSDT --start 20260601
#   python -m backtest.batch_runner
#
# 本文件即 --profile 的默认值，日常回测无需传 --profile。
# 要换一套参数（调参）而不改本文件：复制 config/quick.example.yaml，
# 用 --profile <名字> 运行。
#
# CLI --start / --end 可覆盖本文件的 start / end。
#
# 本文件只写【代码真实消费】的键。早期版本曾写 mode / signal_hub /
# 三段多余配置，它们没有任何消费者，只是与 settings.yaml 同名键取值
# 相反、制造"两处配置都不生效"的假象，已删除。
#
# 与 config/settings.yaml 的关系（重要）：
#   回测的配置来源是【两份】，不是一份 ——
#     settings.yaml   与实盘共用。回测会读它的
#                     use_bar_high_low_for_exit，
#                     该字段决定止损止盈用 K 线 high/low 还是收盘价判定，
#                     直接影响成交次数与 PnL，因此必须回测实盘一致。
#     本文件           回测的运行方式（时间范围/资金/费率/输出/并发）。
#   两者键集合不相交，故不存在覆盖关系。唯一语义重复是
#   data_dir ↔ settings.data_manager.csv_dir，必须一致，
#   由 verify_data_dir_consistency() 在启动时校验，不一致直接退出。
# =============================================================================

# 回测时间范围（CLI --start/--end 可覆盖）
start: "20260601"
end: ""          # 空则用当前时间

# 资金与费用（回测核算口径，与策略层 capital.max_cash 语义不同）
cash: 5000
commission: 0.0004   # 币安合约 taker 0.04%

# 数据与输出（data_dir 必须与 settings.yaml 的 csv_dir 一致，启动时校验）
data_dir: "./data/klines"
output_dir: "./backtest_output"
use_today_as_output_date: true
log_level: "INFO"

# 并发
max_workers: 4

# =============================================================================
# replay.py 动态覆盖说明
# =============================================================================
# replay.py 执行每日回放时，会以本文件为模板，在每个快照仓库的
# config/backtest.yaml 生成实例（供 run_backtest_batch.sh --profile backtest 读取）。
# 生成时动态覆盖以下字段：
#   start / end       ← replay 日期（CLI --start/--end 仍可覆盖）
#   data_dir          ← 固定 ./data/klines（= download_data.py 的 K线写入路径，
#                       与 settings.csv_dir 一致，过 verify_data_dir_consistency 校验）
#   output_dir        ← replay_outputs/{day}/{folder}/ 绝对路径
#                       （回测原生写入，replay 无需 cp 归集）
# 其余键（cash/commission/use_today_as_output_date/log_level/max_workers）
# 取本文件默认值。生成前若快照已有 config/backtest.yaml，备份为 backtest.yaml.bak。
#
# 日常手动回测仍用本文件默认值，无需改。
# =============================================================================
