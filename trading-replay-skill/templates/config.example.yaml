# Trading Replay Skill — 全局配置模板
# 复制为 config.yaml 并根据实际环境修改

# ===== 远程同步配置 =====
scp:
  # 实盘机器连接信息
  # 敏感信息建议放在 .env 中，此处用 ${ENV_VAR} 引用
  host: ${SCP_HOST}
  port: ${SCP_PORT:-22}
  user: ${SCP_USER}
  # 实盘项目根目录（如 /home/trader/your_project）
  # rsync 会拉取整个项目，自动排除日志/产物/K线数据
  project_dir: ${SCP_PROJECT_DIR}
  # SSH 私钥路径
  key: ${SCP_KEY:-~/.ssh/id_rsa}
  # 超时（秒）
  timeout: ${SCP_TIMEOUT:-30}
  # 重试次数
  retry: ${SCP_RETRY:-3}

# ===== 回测配置 =====
replay:
  # 回测日期（空=当天，或 YYYYMMDD 格式）
  date: ""
  # 要回放的模型类型
  # product: 实盘策略
  # smoking: 模拟盘策略
  # paper: 纸上交易策略
  models:
    - product
    - smoking
    - paper

# ===== 目录配置 =====
paths:
  # 策略代码快照目录
  snapshot_dir: ./snapshot
  # 日志输出目录
  logs_dir: ./logs
  # 回测结果输出目录
  replay_outputs_dir: ./replay_outputs

# ===== 回测引擎配置 =====
backtest:
  # Python 命令
  python_cmd: python3
  # K 线数据根目录
  data_dir: ./data
  # 1m K 线数据目录
  kline_data_dir: ./data/strategies/1m
