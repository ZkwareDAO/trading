# =============================================================================
# Discovery 策略登记表
# =============================================================================
# 顶层 key = 策略目录名（也是 git clone 的目标文件夹 basename）。
# fetch_strategies.py 读 git_url 执行 clone/pull；discovery.py 读顶层 key 遍历。
#
# 结构:
#   <策略目录名>:
#     git_url: <git 仓库地址>      # 可空，空则该策略跳过并告警
#
# 示例:
strategy_name1:
  git_url: git@github.com:user/strategy_name1.git
strategy_name2:
  git_url: https://github.com/user/strategy_name2.git
strategy_name3:
  git_url:
